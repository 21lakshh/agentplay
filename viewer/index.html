<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2356653e'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e7f2d4'/%3E%3C/svg%3E" />
    <title>Agentplay Viewer</title>
    <script>
      // Theme before first paint: ?theme=light|dark, then a remembered choice,
      // then the OS preference (followed live while no choice is pinned).
      (function () {
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function pinned() {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'light' || q === 'dark') return q;
          try {
            var s = localStorage.getItem('agentplay.theme');
            if (s === 'light' || s === 'dark') return s;
          } catch (e) {}
          return null;
        }
        function apply() {
          var t = pinned() || (mq.matches ? 'dark' : 'light');
          root.classList.toggle('dark', t === 'dark');
          root.dataset.theme = t;
        }
        apply();
        mq.addEventListener('change', apply);
        window.__agentplayApplyTheme = apply;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
