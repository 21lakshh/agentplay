version: 2
updates:
  # Actions are pinned by commit SHA, so they only move when this opens a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
